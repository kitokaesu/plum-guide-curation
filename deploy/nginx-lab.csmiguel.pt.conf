# /etc/nginx/sites-available/plum-guide
# Ativar com: ln -s /etc/nginx/sites-available/plum-guide /etc/nginx/sites-enabled/
# Depois: nginx -t && systemctl reload nginx
#
# O Certbot acrescenta aqui o bloco :443 quando correres
#   certbot --nginx -d lab.csmiguel.pt

server {
    listen 80;
    listen [::]:80;
    server_name lab.csmiguel.pt;

    # As capturas e o deck não são enviados por formulários, mas deixa margem.
    client_max_body_size 8m;

    # Compressão para HTML/CSS/JS
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Necessário para o hot reload do Next em desenvolvimento
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
